name = "english-bot"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Веб-панель преподавателя (файлы из папки public)
[assets]
directory = "./public"

# Каждые 5 минут: уведомления об открытии занятий и авто-разбор по окончании
[triggers]
crons = ["*/5 * * * *"]

[vars]
# Модель Gemini. "gemini-flash-latest" — всегда актуальная Flash-модель
GEMINI_MODEL = "gemini-flash-latest"

[[d1_databases]]
binding = "DB"
database_name = "english-bot"
database_id = "1e560130-3366-4a08-9b92-897d42adcf84"
